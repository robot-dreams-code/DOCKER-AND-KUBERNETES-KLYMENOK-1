# nonk8s
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: course-app-application-v1
  namespace: argocd
spec:
  project: lab-app-project
  source:
    repoURL: https://github.com/mykytamykhailenko/argocd-lab.git
    targetRevision: master
    path: course-app/dev
  destination:
    namespace: lab
    server: 'https://kubernetes.default.svc'
  syncPolicy:
    automated:
      enabled: true
      selfHeal: true