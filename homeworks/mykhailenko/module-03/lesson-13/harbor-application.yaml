# nonk8s
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: harbor-application
  namespace: argocd
spec:
  project: lab-app-project
  sources:
    - repoURL: https://helm.goharbor.io
      chart: harbor
      targetRevision: 1.18.1
      helm:
        valueFiles:
          - $custom-repo/harbor/values.yaml
    - repoURL: https://github.com/mykytamykhailenko/argocd-lab.git
      targetRevision: master
      ref: custom-repo
  destination:
    namespace: lab
    server: 'https://kubernetes.default.svc'
  syncPolicy:
    automated:
      enabled: true
      selfHeal: true
      prune: true